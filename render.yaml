services:
  - type: web
    name: markit-terminal
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python paper_trading_terminal/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RUN_SCANNER_IN_BACKGROUND
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
